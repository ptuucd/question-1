<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>國立成大南工 115學年度第1學期第1次段考 線上刷題系統</title>
  <style>
    :root {
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --border: #334155;
      --accent: #1e3a8a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 12px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    header {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      text-align: center;
    }

    h1 {
      font-size: 1.15rem;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .sub-title {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      background: var(--card-bg);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      text-align: center;
    }

    .dash-item .label {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .dash-item .value {
      font-size: 1.1rem;
      font-weight: bold;
    }

    .val-score { color: var(--primary); }
    .val-correct { color: var(--success); }
    .val-wrong { color: var(--danger); }
    .val-fav { color: var(--warning); }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--card-bg);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .btn-group {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      background: #334155;
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-main);
      transition: all 0.15s;
    }

    button.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .quiz-card {
      background: var(--card-bg);
      padding: 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .q-badge {
      font-size: 0.8rem;
      font-weight: bold;
      background: var(--accent);
      color: #93c5fd;
      padding: 4px 10px;
      border-radius: 16px;
    }

    .jump-container {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .jump-input {
      width: 55px;
      padding: 5px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    .star-btn {
      background: transparent;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #64748b;
      padding: 0;
      line-height: 1;
    }

    .star-btn.fav {
      color: #f59e0b;
    }

    .question-content {
      font-size: 1.05rem;
      line-height: 1.6;
      font-weight: 600;
      color: #f8fafc;
    }

    .q-diagram {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 8px 0;
      padding: 10px;
      background: #0b1329;
      border-radius: 8px;
      border: 1px solid var(--border);
      overflow-x: auto;
    }

    .q-diagram svg {
      max-width: 100%;
      height: auto;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: #0f172a;
      font-size: 0.95rem;
      line-height: 1.5;
      cursor: pointer;
      color: var(--text-main);
    }

    .opt-letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #334155;
      font-weight: bold;
      font-size: 0.8rem;
      flex-shrink: 0;
    }

    .option-btn.correct {
      background-color: #064e3b !important;
      border-color: var(--success) !important;
      color: #a7f3d0 !important;
      font-weight: 600;
    }

    .option-btn.correct .opt-letter {
      background: var(--success);
      color: white;
    }

    .option-btn.wrong {
      background-color: #7f1d1d !important;
      border-color: var(--danger) !important;
      color: #fecaca !important;
      font-weight: 600;
    }

    .option-btn.wrong .opt-letter {
      background: var(--danger);
      color: white;
    }

    .explanation-box {
      display: none;
      background: #0f172a;
      border-left: 4px solid var(--primary);
      padding: 12px 14px;
      border-radius: 6px;
      font-size: 0.88rem;
      line-height: 1.6;
      color: #cbd5e1;
    }

    .explanation-box.show {
      display: block;
    }

    .explanation-box strong {
      color: var(--primary);
      display: block;
      margin-bottom: 4px;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 4px;
    }

    .nav-btn {
      flex: 1;
      padding: 12px;
      font-size: 0.95rem;
      border-radius: 10px;
    }

    .nav-btn.primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>國立成大南工 115學年度第1學期第1次段考題庫</h1>
    <div class="sub-title">基本電學與實習工安 ‧ 全方位線上模擬刷題系統</div>
  </header>

  <div class="dashboard">
    <div class="dash-item">
      <div class="label">作答進度 / 總題數</div>
      <div class="value val-score" id="stat-score">0 / 216</div>
    </div>
    <div class="dash-item">
      <div class="label">答對數</div>
      <div class="value val-correct" id="stat-correct">0</div>
    </div>
    <div class="dash-item">
      <div class="label">答錯數</div>
      <div class="value val-wrong" id="stat-wrong">0</div>
    </div>
    <div class="dash-item">
      <div class="label">收藏題數</div>
      <div class="value val-fav" id="stat-fav">0</div>
    </div>
  </div>

  <div class="controls">
    <div class="btn-group">
      <button id="btn-mode-all" class="active" onclick="switchFilter('all')">全部題庫 (<span id="total-count">216</span>題)</button>
      <button id="btn-mode-wrong" onclick="switchFilter('wrong')">錯題複習 (<span id="wrong-count">0</span>)</button>
      <button id="btn-mode-fav" onclick="switchFilter('fav')">收藏題 (<span id="fav-count">0</span>)</button>
    </div>
    <div class="btn-group">
      <button id="btn-shuffle" onclick="toggleShuffle()">隨機模式: 關</button>
      <button onclick="resetStats()">重置紀錄</button>
    </div>
  </div>

  <div class="quiz-card">
    <div class="card-top">
      <span class="q-badge" id="q-counter">題號...</span>
      <div class="jump-container">
        <span>跳至</span>
        <input type="number" id="jump-idx" class="jump-input" min="1" max="216" onkeydown="handleJump(event)">
        <span>題</span>
      </div>
      <button class="star-btn" id="star-btn" onclick="toggleCurrentFav()">★</button>
    </div>

    <div class="question-content" id="q-text">題庫載入中...</div>
    <div id="q-diagram-container"></div>
    <div class="options-list" id="q-options"></div>

    <div class="explanation-box" id="q-explanation">
      <strong>【詳解 / 解析】</strong>
      <span id="explanation-text"></span>
    </div>
  </div>

  <div class="nav-bar">
    <button class="nav-btn" onclick="prevQuestion()">上一題</button>
    <button class="nav-btn primary" onclick="nextQuestion()">下一題</button>
  </div>
</div>

let currentIdx = 0;
let filteredQuestions = [...rawQuestions];
let userAnswers = {};
let favoriteIds = new Set();
let isShuffle = false;

function init() {
  document.getElementById("total-count").innerText = rawQuestions.length;
  renderQuestion();
}

function renderQuestion() {
  if (filteredQuestions.length === 0) {
    document.getElementById("q-counter").innerText = "無題目";
    document.getElementById("q-text").innerText = "目前分類無題目";
    document.getElementById("q-diagram-container").innerHTML = "";
    document.getElementById("q-options").innerHTML = "";
    document.getElementById("q-explanation").classList.remove("show");
    updateDashboard();
    return;
  }

  if (currentIdx >= filteredQuestions.length) currentIdx = filteredQuestions.length - 1;
  if (currentIdx < 0) currentIdx = 0;

  const item = filteredQuestions[currentIdx];
  document.getElementById("q-counter").innerText = `題號: ${item.id} (${currentIdx + 1}/${filteredQuestions.length})`;
  document.getElementById("q-text").innerText = `${item.id}. ${item.q}`;

  const diagContainer = document.getElementById("q-diagram-container");
  if (item.diagram) {
    diagContainer.innerHTML = `<div class="q-diagram">${item.diagram}</div>`;
  } else {
    diagContainer.innerHTML = "";
  }

  const optContainer = document.getElementById("q-options");
  optContainer.innerHTML = "";

  const userAns = userAnswers[item.id];
  const hasAnswered = userAns !== undefined;

  for (const [key, val] of Object.entries(item.opts)) {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="opt-letter">${key}</span> <span>${val}</span>`;

    if (hasAnswered) {
      if (key === item.ans) {
        btn.classList.add("correct");
      } else if (key === userAns) {
        btn.classList.add("wrong");
      }
      btn.disabled = true;
    } else {
      btn.onclick = () => selectOption(key);
    }
    optContainer.appendChild(btn);
  }

  const expBox = document.getElementById("q-explanation");
  if (hasAnswered) {
    document.getElementById("explanation-text").innerText = item.exp || "暫無詳解說明。";
    expBox.classList.add("show");
  } else {
    expBox.classList.remove("show");
  }

  const starBtn = document.getElementById("star-btn");
  starBtn.classList.toggle("fav", favoriteIds.has(item.id));

  updateDashboard();
}

function selectOption(ans) {
  const item = filteredQuestions[currentIdx];
  userAnswers[item.id] = ans;
  renderQuestion();
}

function nextQuestion() {
  if (currentIdx < filteredQuestions.length - 1) {
    currentIdx++;
    renderQuestion();
  }
}

function prevQuestion() {
  if (currentIdx > 0) {
    currentIdx--;
    renderQuestion();
  }
}

function handleJump(e) {
  if (e.key === "Enter") {
    const val = parseInt(e.target.value);
    const targetIdx = filteredQuestions.findIndex(q => q.id === val);
    if (targetIdx !== -1) {
      currentIdx = targetIdx;
      renderQuestion();
    } else {
      alert("目前列表找不到該題號！");
    }
  }
}

function toggleCurrentFav() {
  const item = filteredQuestions[currentIdx];
  if (!item) return;
  if (favoriteIds.has(item.id)) {
    favoriteIds.delete(item.id);
  } else {
    favoriteIds.add(item.id);
  }
  renderQuestion();
}

function switchFilter(type) {
  document.querySelectorAll(".controls .btn-group button").forEach(b => b.classList.remove("active"));
  if (type === 'all') {
    filteredQuestions = [...rawQuestions];
    document.getElementById("btn-mode-all").classList.add("active");
  } else if (type === 'wrong') {
    filteredQuestions = rawQuestions.filter(q => userAnswers[q.id] && userAnswers[q.id] !== q.ans);
    document.getElementById("btn-mode-wrong").classList.add("active");
  } else if (type === 'fav') {
    filteredQuestions = rawQuestions.filter(q => favoriteIds.has(q.id));
    document.getElementById("btn-mode-fav").classList.add("active");
  }
  if (isShuffle) {
    filteredQuestions.sort(() => Math.random() - 0.5);
  }
  currentIdx = 0;
  renderQuestion();
}

function toggleShuffle() {
  isShuffle = !isShuffle;
  document.getElementById("btn-shuffle").innerText = `隨機模式: ${isShuffle ? '開' : '關'}`;
  document.getElementById("btn-shuffle").classList.toggle("active", isShuffle);
  if (isShuffle) {
    filteredQuestions.sort(() => Math.random() - 0.5);
  } else {
    const activeBtn = document.querySelector(".controls .btn-group button.active");
    if (activeBtn && activeBtn.id === 'btn-mode-wrong') {
      filteredQuestions = rawQuestions.filter(q => userAnswers[q.id] && userAnswers[q.id] !== q.ans);
    } else if (activeBtn && activeBtn.id === 'btn-mode-fav') {
      filteredQuestions = rawQuestions.filter(q => favoriteIds.has(q.id));
    } else {
      filteredQuestions = [...rawQuestions];
    }
  }
  currentIdx = 0;
  renderQuestion();
}

function resetStats() {
  if (confirm("確定要重置所有作答與收藏紀錄嗎？")) {
    userAnswers = {};
    favoriteIds.clear();
    currentIdx = 0;
    renderQuestion();
  }
}

function updateDashboard() {
  let correct = 0;
  let wrong = 0;
  let answered = 0;

  for (const [id, ans] of Object.entries(userAnswers)) {
    const q = rawQuestions.find(item => item.id == id);
    if (q) {
      answered++;
      if (q.ans === ans) correct++;
      else wrong++;
    }
  }

  document.getElementById("stat-score").innerText = `${answered} / ${rawQuestions.length}`;
  document.getElementById("stat-correct").innerText = correct;
  document.getElementById("stat-wrong").innerText = wrong;
  document.getElementById("stat-fav").innerText = favoriteIds.size;
  document.getElementById("wrong-count").innerText = wrong;
  document.getElementById("fav-count").innerText = favoriteIds.size;
}

init();
</script>
